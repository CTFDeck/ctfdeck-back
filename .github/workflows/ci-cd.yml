name: Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore ./CtfDeck.sln

      - name: Check code formatting
        run: dotnet format ./CtfDeck.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build ./CtfDeck.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test ./CtfDeck.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/report" -reporttypes:"Html;TextSummary"

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' ./coverage/report/Summary.txt)
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage is below 60% (current: $COVERAGE%)"
            exit 1
          else
            echo "✅ Coverage is acceptable: $COVERAGE%"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/report/

  release:
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.base_ref == 'stage'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore ./CtfDeck.sln

      - name: Publish Linux (single file)
        run: |
          dotnet publish ./src/CtfDeck.Terminal/CtfDeck.Terminal.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:UseAppHost=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish/linux

      - name: Publish Windows (single file)
        run: |
          dotnet publish ./src/CtfDeck.Terminal/CtfDeck.Terminal.csproj \
            -c Release -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:UseAppHost=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish/windows

      - name: Publish macOS (single file)
        run: |
          dotnet publish ./src/CtfDeck.Terminal/CtfDeck.Terminal.csproj \
            -c Release -r osx-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:UseAppHost=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish/macos

      - name: Verify outputs are single executables
        run: |
          echo "Linux content:"
          ls -la ./publish/linux
          echo "Windows content:"
          ls -la ./publish/windows
          echo "macOS content:"
          ls -la ./publish/macos

          LINUX_EXE=$(find ./publish/linux -maxdepth 1 -type f -perm -u+x | head -n 1)
          WIN_EXE=$(find ./publish/windows -maxdepth 1 -type f -name "*.exe" | head -n 1)
          MAC_EXE=$(find ./publish/macos -maxdepth 1 -type f -perm -u+x | head -n 1)

          if [ -z "$LINUX_EXE" ]; then echo "❌ Linux executable not found"; exit 1; fi
          if [ -z "$WIN_EXE" ]; then echo "❌ Windows executable not found"; exit 1; fi
          if [ -z "$MAC_EXE" ]; then echo "❌ macOS executable not found"; exit 1; fi

          echo "✅ Linux exe: $LINUX_EXE"
          echo "✅ Windows exe: $WIN_EXE"
          echo "✅ macOS exe: $MAC_EXE"

      - name: Create ZIP archives
        run: |
          # Linux
          LINUX_EXE=$(find ./publish/linux -maxdepth 1 -type f -perm -u+x | head -n 1)
          zip -j ./release-linux-x64.zip "$LINUX_EXE"

          # Windows
          WIN_EXE=$(find ./publish/windows -maxdepth 1 -type f -name "*.exe" | head -n 1)
          zip -j ./release-win-x64.zip "$WIN_EXE"

          # macOS
          MAC_EXE=$(find ./publish/macos -maxdepth 1 -type f -perm -u+x | head -n 1)
          zip -j ./release-osx-x64.zip "$MAC_EXE"

      - name: Get PR number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Delete existing release if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="pr-${{ steps.pr.outputs.number }}-stage"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes
          fi
          if git rev-parse "$TAG_NAME" > /dev/null 2>&1; then
            git push --delete origin "$TAG_NAME" || true
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="pr-${{ steps.pr.outputs.number }}-stage"
          gh release create "$TAG_NAME" \
            release-linux-x64.zip \
            release-win-x64.zip \
            release-osx-x64.zip \
            --title "CTFDeck Release #${{ steps.pr.outputs.number }} to stage" \
            --notes "Automated release build for PR #${{ steps.pr.outputs.number }} targeting stage branch" \
            --target ${{ github.head_ref }}
